schema_version: "1.1"
name: existing-repo-plan
description: An existing Node project with its own test script and conventions, supplied read-only. Shipright must explore it first, map the files it will modify, take the gate from the repo, and stop before Phase 1b.
tags: [plan, existing]
runs: 1
execution:
  max_turns: 80
  timeout_seconds: 1200
  allowed_tools: [Read, Glob, Grep, Skill, Agent, AskUserQuestion, TodoWrite]
context:
  # Static fixture, not a scaffold script: the Windows runner mangles script paths it hands to bash.
  add_dirs: [resources]
