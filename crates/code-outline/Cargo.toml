[package]
name = "code-outline"
version = "0.1.1"
edition = "2024"
description = "MCP server that outlines source files and reads single symbols via tree-sitter"
license = "MIT"

[lib]
name = "code_outline"
path = "src/lib.rs"

[[bin]]
name = "code-outline"
path = "src/main.rs"

[dependencies]
rmcp = { version = "3.5.1", features = ["server", "macros", "transport-io"] }
tokio = { version = "1", features = ["macros", "rt-multi-thread", "io-std"] }
serde = { version = "1", features = ["derive"] }
schemars = "1"
ignore = "0.4"
globset = "0.4"
dunce = "1"
anyhow = "1"
serde_json = "1"
tree-sitter = "0.27"
tree-sitter-rust = "0.24"
tree-sitter-typescript = "0.23"
tree-sitter-javascript = "0.25"
tree-sitter-python = "0.25"
tree-sitter-c-sharp = "0.23"

[dev-dependencies]
tempfile = "3"
