[package]
name = "output-trim"
version = "0.1.0"
edition = "2024"
description = "Trims noisy build/test/log output to errors, failures and summaries"
license = "MIT"

[lib]
name = "output_trim"
path = "src/lib.rs"

[[bin]]
name = "output-trim"
path = "src/main.rs"

[dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
regex = "1"

[dev-dependencies]
tempfile = "3"
