[package]
name = "ssh-remote"
version = "0.1.0"
edition = "2024"
description = "MCP server that runs SSH commands with credentials read from files Claude never sees"
license = "MIT"

[lib]
name = "ssh_remote"
path = "src/lib.rs"

[[bin]]
name = "ssh-remote"
path = "src/main.rs"

[dependencies]
zeroize = "1"
chrono = { version = "0.4", default-features = false, features = ["clock"] }
russh = { version = "0.64.1", default-features = false, features = ["ring", "rsa", "flate2"] }
tokio = { version = "1", features = ["macros", "rt-multi-thread", "time", "net"] }

[dev-dependencies]
tempfile = "3"
