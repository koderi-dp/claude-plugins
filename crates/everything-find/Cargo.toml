[package]
name = "everything-find"
version = "0.2.2"
edition = "2024"
description = "MCP server exposing the voidtools Everything index as a `find` tool"
license = "MIT"

[lib]
name = "everything_find"
path = "src/lib.rs"

[[bin]]
name = "everything-find"
path = "src/main.rs"

[dependencies]
rmcp = { version = "3.5.1", features = ["server", "macros", "transport-io"] }
tokio = { version = "1", features = ["macros", "rt-multi-thread", "io-std"] }
serde = { version = "1", features = ["derive"] }
schemars = "1"
ignore = "0.4"
dunce = "1"
chrono = { version = "0.4", default-features = false, features = ["clock"] }
anyhow = "1"

[dev-dependencies]
tempfile = "3"
serde_json = "1"

[build-dependencies]
cc = "1"
